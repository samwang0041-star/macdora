<!-- @dsCard group="交互参考" height=200 subtitle="设置开关" -->
<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>设置开关 · Macdora</title>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font-sans)}.demo{padding:var(--space-24);display:grid;gap:var(--space-16)}h1,p{margin:0}h1{}p{color:var(--ink2);line-height:1.6}#controls{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-12)}.motion-target{padding:var(--space-16);border:1px solid var(--line);background:var(--card);border-radius:var(--radius-card);}#status{min-height:1.5em}</style></head>
<body><main class="demo"><h1 class="section-title">设置开关</h1><p class="body">说明给出禁用原因，网页示例不写入系统设置。</p><div id="controls"></div><p class="body" id="status" role="status" aria-live="polite">网页交互参考，不执行产品操作。</p></main>
<script src="../bundle.js"></script><script>(()=>{const status=document.getElementById("status");const row=document.getElementById("controls");
row.append(MacdoraUI.Toggle({label:"启用通知",checked:true,onChange:value=>status.textContent=value?"通知示例已开启":"通知示例已关闭"}),MacdoraUI.Toggle({label:"减少装饰动效",checked:false,onChange:value=>status.textContent=value?"动效示例偏好已开启":"动效示例偏好已关闭"}),MacdoraUI.Toggle({label:"停止环境后可改",disabled:true}));})();</script></body></html>
