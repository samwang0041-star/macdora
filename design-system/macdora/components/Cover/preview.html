<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Macdora</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
html,body{margin:0;width:960px;height:320px;overflow:hidden;background:var(--canvas);font-family:var(--font-sans)}
.cover{position:relative;width:960px;height:320px;background:var(--canvas);color:var(--ink)}
svg{position:absolute;inset:0;width:960px;height:320px}
.brand{fill:var(--accent-fill)}.cyan{fill:var(--scene-app-top)}.ink{fill:var(--ink)}.cutout{fill:var(--canvas)}
.block{rx:var(--radius-card)}.module{rx:var(--radius-button)}
h1{position:absolute;left:32px;bottom:70px;width:440px;margin:0;font-size:80px;font-weight:600;line-height:.95;letter-spacing:-2px}
p{position:absolute;left:32px;bottom:32px;width:440px;margin:0;font-size:14px;line-height:20px;color:var(--ink2)}

图案：圆角模块化 tile；源于管理端卡片与独立平板窗口的几何层级。
尺度：space-16 / space-32 的倍数；radius-card 与 radius-button。 -->
