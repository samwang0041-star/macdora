<!-- @dsCard group="交互参考" height=240 subtitle="操作按钮" -->
<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>操作按钮 · Macdora</title>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font-sans)}.demo{padding:var(--space-24);display:grid;gap:var(--space-16)}h1,p{margin:0}h1{}p{color:var(--ink2);line-height:1.6}#controls{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-12)}.motion-target{padding:var(--space-16);border:1px solid var(--line);background:var(--card);border-radius:var(--radius-card);}#status{min-height:1.5em}</style></head>
<body><main class="demo"><h1 class="section-title">操作按钮</h1><p class="body">每项操作保留默认、悬停、按下和可见焦点。</p><div id="controls"></div><p class="body" id="status" role="status" aria-live="polite">网页交互参考，不执行产品操作。</p></main>
<script src="../bundle.js"></script><script>(()=>{const status=document.getElementById("status");const row=document.getElementById("controls");
[["安装","primary"],["重试","secondary"],["打开","tinted"],["显示文件","subtle"],["取消","ghost"],["卸载","danger"]].forEach(([label,variant])=>row.append(MacdoraUI.Button({label,variant,onClick:()=>status.textContent="已触发「"+label+"」示例，未执行实际操作。"})));
row.append(MacdoraUI.Button({label:"正在准备",variant:"primary",disabled:true}));})();</script></body></html>
